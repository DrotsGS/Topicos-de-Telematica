syntax = "proto3";

package dfsha;

// =====================================================================
//  DFSha - Sistema de archivos distribuido
//  Curso: Sistemas Distribuidos (SI3007) - Universidad EAFIT
//
//  Un solo .proto por ahora (semana 6). Se separa en tres archivos
//  cuando llegue la semana 10 y haya varios DataNodes.
// =====================================================================


// ---------------------------------------------------------------------
//  1. Cliente <-> NameNode   (plano de control)
// ---------------------------------------------------------------------
service NameNodeService {

  // --- RF1: gestion del namespace ---
  rpc Ls     (PathRequest) returns (LsResponse);
  rpc Mkdir  (PathRequest) returns (StatusResponse);
  rpc Rmdir  (PathRequest) returns (StatusResponse);
  rpc Rm     (PathRequest) returns (StatusResponse);
  rpc Stat   (PathRequest) returns (FileInfo);

  // --- RF2: ciclo de vida de escritura (WORM) ---
  // Create otorga el lease y devuelve donde poner cada bloque.
  // El archivo queda UNDER_CONSTRUCTION: invisible para Ls.
  rpc Create   (CreateRequest)   returns (CreateResponse);
  // Complete hace el commit: el archivo pasa a COMMITTED e inmutable.
  rpc Complete (CompleteRequest) returns (StatusResponse);
  rpc Abort    (LeaseRequest)    returns (StatusResponse);

  // --- RF2: lectura ---
  rpc Open (PathRequest) returns (OpenResponse);

  // --- salud y descubrimiento de lider (semana 12) ---
  rpc Ping (Empty) returns (PingResponse);
}


// ---------------------------------------------------------------------
//  2. Cliente <-> DataNode   (plano de datos)
// ---------------------------------------------------------------------
service DataNodeService {
  rpc PutBlock    (stream BlockChunk)  returns (PutBlockResponse);
  rpc GetBlock    (GetBlockRequest)    returns (stream BlockChunk);
  rpc DeleteBlock (BlockRef)           returns (StatusResponse);

  // Usado tambien por el pipeline DataNode <-> DataNode (semana 11)
  rpc ReplicateTo (ReplicateRequest)   returns (StatusResponse);
}


// ---------------------------------------------------------------------
//  3. NameNode <-> DataNode   (siempre iniciado por el DataNode)
// ---------------------------------------------------------------------
service ControlService {
  // La respuesta al heartbeat lleva los comandos piggyback.
  // El NameNode nunca abre una conexion hacia un DataNode.
  rpc Heartbeat     (HeartbeatRequest)     returns (HeartbeatResponse);
  rpc BlockReport   (BlockReportRequest)   returns (StatusResponse);
  rpc BlockReceived (BlockReceivedRequest) returns (StatusResponse);
}


// =====================================================================
//  Mensajes
// =====================================================================

message Empty {}

message StatusResponse {
  bool   ok      = 1;
  string message = 2;
}

message PingResponse {
  string node_id     = 1;
  bool   is_leader   = 2;   // semana 12: si es false, leader_addr apunta al lider
  string leader_addr = 3;
}

// --- namespace ---

message PathRequest {
  string path  = 1;
  string token = 2;   // JWT, semana 7 en adelante
}

message Entry {
  string name   = 1;
  bool   is_dir = 2;
  uint64 size   = 3;
}

message LsResponse {
  repeated Entry entries = 1;
}

enum FileState {
  UNDER_CONSTRUCTION = 0;
  COMMITTED          = 1;
}

message FileInfo {
  string    path       = 1;
  bool      is_dir     = 2;
  uint64    size       = 3;
  uint32    num_blocks = 4;
  FileState state      = 5;
  int64     created_at = 6;
}

// --- escritura ---

message CreateRequest {
  string path  = 1;
  uint64 size  = 2;   // tamano total, para calcular cuantos bloques
  string token = 3;
}

message BlockAssignment {
  string   block_id     = 1;
  uint32   index        = 2;        // orden dentro del archivo
  uint64   size         = 3;
  repeated string datanodes = 4;    // replicas; la primera es el head del pipeline
  string   access_token = 5;        // firmado por el NameNode
}

message CreateResponse {
  string   lease_id = 1;
  repeated BlockAssignment blocks = 2;
}

message BlockChecksum {
  string block_id = 1;
  string sha256   = 2;
}

message CompleteRequest {
  string   path     = 1;
  string   lease_id = 2;
  repeated BlockChecksum checksums = 3;
}

message LeaseRequest {
  string lease_id = 1;
  string token    = 2;
}

// --- lectura ---

message BlockLocation {
  string   block_id     = 1;
  uint32   index        = 2;
  uint64   size         = 3;
  repeated string datanodes = 4;   // ordenadas por proximidad o carga
  string   sha256       = 5;
  string   access_token = 6;
}

message OpenResponse {
  uint64   size = 1;
  repeated BlockLocation blocks = 2;
}

// --- transferencia de bloques ---

message BlockHeader {
  string   block_id     = 1;
  uint64   size         = 2;
  string   access_token = 3;
  repeated string pipeline = 4;   // siguientes replicas, semana 11
}

// El primer mensaje del stream lleva header; los siguientes, data.
message BlockChunk {
  oneof payload {
    BlockHeader header = 1;
    bytes       data   = 2;
  }
}

message PutBlockResponse {
  bool   ok      = 1;
  string sha256  = 2;
  string message = 3;
}

message GetBlockRequest {
  string block_id     = 1;
  string access_token = 2;
}

message BlockRef {
  string block_id = 1;
}

message ReplicateRequest {
  string   block_id = 1;
  repeated string targets = 2;
}

// --- control ---

message HeartbeatRequest {
  string node_id    = 1;
  string addr       = 2;   // host:puerto donde el cliente lo alcanza
  uint64 free_bytes = 3;
  uint32 num_blocks = 4;
}

message ReplicateCommand {
  string   block_id = 1;
  repeated string targets = 2;
}

message DeleteCommand {
  repeated string block_ids = 1;
}

message Command {
  oneof cmd {
    ReplicateCommand replicate = 1;
    DeleteCommand    remove    = 2;
  }
}

message HeartbeatResponse {
  repeated Command commands = 1;   // piggyback
}

message BlockReportRequest {
  string   node_id = 1;
  repeated string block_ids = 2;
}

message BlockReceivedRequest {
  string node_id  = 1;
  string block_id = 2;
  string sha256   = 3;
}
